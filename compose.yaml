services:
  app:
    build: .
    ports: ["127.0.0.1:7860:7860"]
    environment:
      CIRCLEPATH_HOST: 0.0.0.0
      CIRCLEPATH_AI_PROVIDER: ${CIRCLEPATH_AI_PROVIDER:-offline}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      ARIZE_API_KEY: ${ARIZE_API_KEY:-}
      ARIZE_SPACE_ID: ${ARIZE_SPACE_ID:-}
      ARIZE_PROJECT_NAME: circlepath-rj
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: http://otel-collector:4318/v1/traces
    volumes: ["app-data:/app/data"]
    depends_on: [otel-collector]
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.162.0
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes: ["./observability/collector.yaml:/etc/otelcol/config.yaml:ro"]
    depends_on: [tempo]
  tempo:
    image: grafana/tempo:3.1.0
    command: ["-config.file=/etc/tempo.yaml"]
    ports: ["127.0.0.1:3201:3200"]
    volumes: ["./observability/tempo.yaml:/etc/tempo.yaml:ro", "tempo-data:/var/tempo"]
  prometheus:
    image: prom/prometheus:v3.15.0
    command: ["--config.file=/etc/prometheus/prometheus.yaml"]
    ports: ["127.0.0.1:9091:9090"]
    volumes: ["./observability/prometheus.yaml:/etc/prometheus/prometheus.yaml:ro"]
  grafana:
    image: grafana/grafana:13.2.4
    ports: ["127.0.0.1:3300:3000"]
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?Set a local Grafana admin password}
      GF_ANALYTICS_REPORTING_ENABLED: "false"
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on: [prometheus, tempo]
volumes:
  app-data:
  tempo-data:
